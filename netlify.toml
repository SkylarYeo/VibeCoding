[build]
  publish = "."
  command = "echo 'Static site ready for deployment'"

# Handle SPA routing for any future dynamic routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure static assets are served with proper caching
[[headers]]
  for = "/public/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Handle root-level assets if needed
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"